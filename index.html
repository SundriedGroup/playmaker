<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Playmaker</title>
<style>
  :root {
    --bg: #f4f1ec;
    --panel: #ffffff;
    --ink: #171310;
    --muted: #6b6560;
    --line: #e4ded6;
    --teal: #1e6a6c;
    --teal-soft: #d6ebe7;
    --orange: #e85d2f;
    --orange-soft: #fbe3d9;
    --good: #1e6a6c;
    --bad: #b5402a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1615;
      --panel: #152120;
      --ink: #eef2f0;
      --muted: #9aa7a4;
      --line: #263735;
      --teal: #6fc0b2;
      --teal-soft: #1d3633;
      --orange: #f0794f;
      --orange-soft: #3a241c;
      --good: #6fc0b2;
      --bad: #f08a6e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .handle { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .followers { font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
  .followers small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .meta { color: var(--muted); font-size: 13px; text-align: right; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 9px 16px;
    background: var(--teal); color: #fff; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0e1615; } }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
  .banner.warn { background: var(--orange-soft); }
  .banner.info { background: var(--teal-soft); }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .tile .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .value { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .delta { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .tile.target { border-color: var(--orange); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 14px; }
  .chart svg { width: 100%; height: 120px; display: block; }
  .chart .axis { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; }
  .series-row { display: grid; grid-template-columns: 120px 1fr 64px; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
  .bar { height: 10px; border-radius: 6px; background: var(--teal-soft); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--teal); border-radius: 6px; }
  .series-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .posts { display: grid; gap: 10px; }
  .post { display: grid; grid-template-columns: 72px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-decoration: none; color: inherit; }
  .post.hit { border-color: var(--orange); }
  .thumb { width: 72px; height: 90px; border-radius: 10px; background: var(--teal-soft) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--teal); font-weight: 700; }
  .post .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); }
  .chip.other { background: var(--line); color: var(--muted); }
  .post .line { font-weight: 650; margin: 4px 0 8px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stats b { font-weight: 800; }
  .stats .k { color: var(--muted); }
  .gate { max-width: 360px; margin: 18vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .gate h1 { font-size: 20px; margin: 0 0 6px; }
  .gate p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .gate input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 10px; }
  .gate .err { color: var(--bad); font-size: 13px; min-height: 18px; }
  .goal { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; align-items: center; }
  @media (max-width: 760px) { .goal { grid-template-columns: 1fr; } }
  .goal .big { font-size: 13px; color: var(--muted); }
  .goal .big b { color: var(--ink); font-size: 22px; letter-spacing: -.01em; }
  .progress { height: 12px; border-radius: 8px; background: var(--teal-soft); overflow: hidden; margin: 10px 0 8px; }
  .progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--orange)); }
  .goal .note { font-size: 13px; color: var(--muted); }
  .goal svg { width: 100%; height: 90px; display: block; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; width: max-content; margin: 4px 0 16px; }
  .tab { background: transparent; color: var(--muted); padding: 7px 16px; }
  .tab.active { background: var(--teal); color: #fff; }
  @media (prefers-color-scheme: dark) { .tab.active { color: #0e1615; } }
  button.sm { padding: 6px 12px; font-size: 13px; }
  .weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .weeklabel { display: flex; flex-direction: column; min-width: 150px; flex: 1; line-height: 1.2; }
  .weeklabel b { font-size: 18px; }
  .weeklabel span { font-size: 12px; color: var(--muted); }
  .idea-form { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 12px; }
  .idea-form #ideaHook { grid-column: 1 / -1; }
  .idea-form input, .item textarea, .item input, .item select {
    font: inherit; font-size: 14px; width: 100%; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .row-actions { display: flex; gap: 8px; justify-content: flex-end; grid-column: 1 / -1; }
  .day { margin-bottom: 14px; }
  .day h3 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 700; }
  .day.today h3 { color: var(--orange); }
  .day .empty { font-size: 13px; color: var(--muted); padding: 2px 0 6px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
  .item.posted { border-color: var(--teal); }
  .item .head { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  .item .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); text-align: left; }
  .item .title { font-weight: 700; margin: 4px 0 2px; }
  .item .hook { font-size: 14px; color: var(--ink); opacity: .85; }
  .item select.stage { width: auto; padding: 5px 8px; font-size: 12px; font-weight: 700; border-radius: 999px; }
  .stage-Idea { color: var(--muted); } .stage-Scripted { color: #b7791f; } .stage-Filmed, .stage-Edited { color: #2b6cb0; }
  .stage-Scheduled { color: #805ad5; } .stage-Posted { color: var(--teal); } .stage-Parked { color: var(--muted); }
  .live { margin-top: 8px; font-size: 13px; background: var(--teal-soft); border-radius: 10px; padding: 7px 10px; display: flex; gap: 12px; flex-wrap: wrap; }
  .live a { color: var(--teal); font-weight: 700; text-decoration: none; }
  .item .toggle { background: transparent; color: var(--teal); padding: 6px 0 0; font-size: 13px; }
  .body { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .body h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .md { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .md h5 { font-size: 13px; margin: 12px 0 4px; }
  .md p { margin: 0 0 8px; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
  .caption { white-space: pre-wrap; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; }
  .item textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
  .item label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .parked { margin-top: 18px; }
  .parked summary { cursor: pointer; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 10; }
  .hidden { display: none !important; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <form id="gate" class="gate hidden" autocomplete="on">
    <h1>Playmaker</h1>
    <p>Enter the dashboard password.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="err" id="gateErr"></div>
    <button type="submit">Open</button>
  </form>

  <main id="app" class="hidden">
    <header>
      <div>
        <div class="handle" id="handle">@—</div>
        <div class="followers"><span id="followers">—</span> <small>followers</small></div>
      </div>
      <div class="meta">
        <div id="updated">Loading…</div>
        <div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end;">
          <button class="ghost" id="logout" type="button">Lock</button>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </div>
    </header>

    <div id="banner"></div>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="score" role="tab">Scorecard</button>
      <button type="button" class="tab" data-tab="plan" role="tab">Plan</button>
    </nav>

    <section id="viewPlan" class="hidden">
      <div class="weekbar">
        <button type="button" class="ghost sm" id="prevWeek" aria-label="Previous week">‹</button>
        <div class="weeklabel"><b id="weekLabel">This week</b><span id="weekSub"></span></div>
        <button type="button" class="ghost sm" id="nextWeek" aria-label="Next week">›</button>
        <button type="button" class="ghost sm" id="thisWeek">Today</button>
        <button type="button" class="sm" id="addIdea">+ Idea</button>
      </div>
      <form id="ideaForm" class="panel idea-form hidden">
        <input id="ideaTitle" placeholder="Idea or post title" maxlength="200" required>
        <input id="ideaDate" type="date" aria-label="Date (optional)">
        <input id="ideaHook" placeholder="Opening line (optional)" maxlength="500">
        <div class="row-actions"><button type="button" class="ghost sm" id="ideaCancel">Cancel</button><button type="submit" class="sm">Add</button></div>
      </form>
      <div id="planMsg"></div>
      <div id="planDays"></div>
      <details class="parked" id="parkedWrap">
        <summary>Parked &amp; undated <span id="parkedCount"></span></summary>
        <div id="parkedList"></div>
      </details>
    </section>

    <section id="viewScore">
    <div class="panel goal" id="goal"></div>

    <h2>This week vs last week</h2>
    <div class="tiles" id="tiles"></div>

    <div class="grid2" style="margin-top:10px;">
      <div class="panel chart">
        <h3>New followers per day, last 30 days</h3>
        <div id="trend"></div>
      </div>
      <div class="panel">
        <h3>Average reach by series</h3>
        <div id="series"></div>
      </div>
    </div>

    <h2>Latest posts</h2>
    <div class="posts" id="posts"></div>

    <footer>Orange border = 1,000+ reach. Data from the Meta Graph API; Meta's own figures can lag by a few hours.</footer>
    </section>
  </main>
</div>

<script>
(function () {
  var KEY = 'ig-dashboard-key';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function () { try { return localStorage.getItem(KEY) || ''; } catch (e) { return memKey; } },
    set: function (v) { memKey = v; try { localStorage.setItem(KEY, v); } catch (e) {} },
    clear: function () { memKey = ''; try { localStorage.removeItem(KEY); } catch (e) {} }
  };
  var memKey = '';
  window.__pm = window.__pm || {};
  window.__pm.getKey = function () { return store.get(); };
  window.__pm.onLocked = function () { store.clear(); showGate('Wrong password.'); };

  function fmt(n) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('en-ZA');
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; });
  }
  function delta(now, prev) {
    if (!prev && !now) return '<div class="delta flat">no posts either week</div>';
    if (!prev) return '<div class="delta up">new this week</div>';
    var pct = Math.round(((now - prev) / prev) * 100);
    var cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
    var sign = pct > 0 ? '+' : '';
    return '<div class="delta ' + cls + '">' + sign + pct + '% vs last week (' + fmt(prev) + ')</div>';
  }
  function showGate(msg) {
    $('app').classList.add('hidden');
    $('gate').classList.remove('hidden');
    $('gateErr').textContent = msg || '';
    $('pw').focus();
  }

  function renderTiles(d) {
    var t = d.thisWeek, l = d.lastWeek;
    var tiles = [
      ['Posts', t.posts, l.posts],
      ['Reach', t.reach, l.reach],
      ['Shares', t.shares, l.shares],
      ['Saves', t.saves, l.saves],
      ['Follows from posts', t.follows, l.follows]
    ];
    var html = tiles.map(function (x) {
      return '<div class="tile"><div class="label">' + x[0] + '</div><div class="value">' + fmt(x[1]) + '</div>' + delta(x[1], x[2]) + '</div>';
    }).join('');
    var hit = t.over1000 > 0;
    html += '<div class="tile target"><div class="label">Target: one post over 1,000 reach</div><div class="value">' +
      (hit ? '✓ ' + t.over1000 : '0') + '</div><div class="delta ' + (hit ? 'up' : 'flat') + '">' +
      (t.best ? 'Best: ' + esc(t.best.caption).slice(0, 40) + ' (' + fmt(t.best.reach) + ')' : 'No posts yet this week') + '</div></div>';
    $('tiles').innerHTML = html;
  }

  function renderTrend(points) {
    if (!points || !points.length) {
      $('trend').innerHTML = '<p style="color:var(--muted);font-size:13px;margin:0">Meta didn\'t return follower data. It needs 100+ followers and the insights permission.</p>';
      return;
    }
    var w = 300, h = 110, n = points.length, gap = 2;
    var max = Math.max.apply(null, points.map(function (p) { return p.value || 0; })) || 1;
    var bw = (w - gap * (n - 1)) / n;
    var bars = points.map(function (p, i) {
      var v = p.value || 0, bh = Math.max(v ? 3 : 1, (v / max) * (h - 14));
      var x = i * (bw + gap), y = h - bh;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" fill="' + (v === max ? 'var(--orange)' : 'var(--teal)') + '" opacity="' + (v ? 1 : .25) + '"><title>' + new Date(p.date).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' }) + ': ' + v + '</title></rect>';
    }).join('');
    var total = points.reduce(function (s, p) { return s + (p.value || 0); }, 0);
    var first = new Date(points[0].date).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
    var last = new Date(points[n - 1].date).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
    $('trend').innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="New followers per day">' + bars + '</svg>' +
      '<div class="axis"><span>' + first + '</span><span><b style="color:var(--ink)">' + fmt(total) + '</b> in 30 days · best day ' + max + '</span><span>' + last + '</span></div>';
  }

  function renderSeries(series) {
    if (!series || !series.length) { $('series').innerHTML = ''; return; }
    var max = Math.max.apply(null, series.map(function (s) { return s.avgReach; })) || 1;
    $('series').innerHTML = series.map(function (s) {
      return '<div class="series-row"><span>' + esc(s.series) + ' <span style="color:var(--muted)">(' + s.posts + ')</span></span>' +
        '<div class="bar"><span style="width:' + Math.round((s.avgReach / max) * 100) + '%"></span></div>' +
        '<span class="num">' + fmt(s.avgReach) + '</span></div>';
    }).join('');
  }

  function renderPosts(posts) {
    $('posts').innerHTML = posts.map(function (p) {
      var date = new Date(p.timestamp).toLocaleString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      var thumb = p.thumbnail ? 'style="background-image:url(\'' + encodeURI(p.thumbnail) + '\')"' : '';
      var stats = [
        ['Reach', p.reach], ['Views', p.views], ['Shares', p.shares], ['Saves', p.saved],
        ['Follows', p.follows], ['Comments', p.comments], ['Likes', p.likes]
      ];
      if (p.avgWatchMs) stats.push(['Avg watch', (p.avgWatchMs / 1000).toFixed(1) + 's']);
      return '<a class="post' + ((p.reach || 0) >= 1000 ? ' hit' : '') + '" href="' + esc(p.permalink) + '" target="_blank" rel="noopener">' +
        '<div class="thumb" ' + thumb + '>' + (p.thumbnail ? '' : esc(p.kind)) + '</div>' +
        '<div><div class="top"><span class="chip' + (p.series === 'Other' ? ' other' : '') + '">' + esc(p.series) + '</span><span>' + esc(p.kind) + '</span><span>' + date + '</span></div>' +
        '<div class="line">' + esc(p.firstLine) + '</div>' +
        '<div class="stats">' + stats.map(function (s) {
          return '<span><span class="k">' + s[0] + '</span> <b>' + (typeof s[1] === 'string' ? s[1] : fmt(s[1])) + '</b></span>';
        }).join('') + '</div></div></a>';
    }).join('');
  }

  function renderGoal(d) {
    var goal = d.followerGoal || 10000, now = d.profile.followers || 0;
    var pct = Math.min(100, (now / goal) * 100);
    var h = (d.followerHistory || []).slice();
    var note = 'Daily snapshots start once Supabase is connected.', chart = '';
    if (h.length >= 2) {
      var first = h[0], last = h[h.length - 1];
      var weeks = Math.max(1, (new Date(last.date) - new Date(first.date)) / (7 * 864e5));
      var perWeek = (last.followers - first.followers) / weeks;
      var left = goal - now;
      note = '+' + fmt(last.followers - first.followers) + ' since ' + new Date(first.date).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' }) +
        ' · about ' + perWeek.toFixed(1) + ' a week. ' +
        (perWeek > 0 ? 'At this pace: ' + fmt(Math.ceil(left / perWeek)) + ' weeks to ' + fmt(goal) + '.' : 'Flat so far.');
      var w = 300, ht = 90, min = Math.min.apply(null, h.map(function (p) { return p.followers; })), max = Math.max.apply(null, h.map(function (p) { return p.followers; }));
      var span = Math.max(1, max - min), t0 = new Date(first.date).getTime(), t1 = Math.max(t0 + 1, new Date(last.date).getTime());
      var pts = h.map(function (p) {
        var x = ((new Date(p.date).getTime() - t0) / (t1 - t0)) * (w - 8) + 4;
        var y = ht - 8 - ((p.followers - min) / span) * (ht - 16);
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      chart = '<svg viewBox="0 0 ' + w + ' ' + ht + '" preserveAspectRatio="none" role="img" aria-label="Follower history">' +
        '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
        '<circle cx="' + pts[pts.length - 1].split(',')[0] + '" cy="' + pts[pts.length - 1].split(',')[1] + '" r="4" fill="var(--orange)"/></svg>';
    }
    $('goal').innerHTML = '<div><div class="big">Road to <b>' + fmt(goal) + '</b></div>' +
      '<div class="progress"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
      '<div class="note"><b style="color:var(--ink)">' + fmt(now) + '</b> now · ' + pct.toFixed(1) + '% · ' + fmt(goal - now) + ' to go<br>' + note + '</div></div>' +
      '<div>' + chart + '</div>';
  }

  function render(d) {
    $('handle').textContent = '@' + (d.profile.username || '');
    $('followers').textContent = fmt(d.profile.followers);
    $('updated').textContent = 'Updated ' + new Date(d.generatedAt).toLocaleString('en-ZA', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    $('banner').innerHTML = d.mock ? '<div class="banner info">Sample data. Set MOCK to 0 and add your Meta token in Vercel to see live numbers.</div>' : '';
    renderGoal(d);
    renderTiles(d);
    renderTrend(d.followerTrend);
    renderSeries(d.series);
    renderPosts(d.posts || []);
    window.__pm = window.__pm || {};
    window.__pm.dashboard = d;
    if (window.__pm.onDashboard) window.__pm.onDashboard();
  }

  function load() {
    var key = store.get();
    $('updated').textContent = 'Loading…';
    fetch('/api/dashboard', { headers: { 'x-dashboard-key': key } })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (res) {
        if (res.status === 401) { store.clear(); showGate(key ? 'Wrong password.' : ''); return; }
        $('gate').classList.add('hidden');
        $('app').classList.remove('hidden');
        if (res.status !== 200) {
          $('updated').textContent = 'Not updated';
          $('banner').innerHTML = '<div class="banner warn"><b>Couldn\'t load your data.</b> ' + esc(res.body.error || '') + (res.body.hint ? '<br>' + esc(res.body.hint) : '') + '</div>';
          return;
        }
        render(res.body);
      })
      .catch(function () {
        $('app').classList.remove('hidden');
        $('banner').innerHTML = '<div class="banner warn">Network error. Try Refresh.</div>';
      });
  }

  $('gate').addEventListener('submit', function (e) {
    e.preventDefault();
    store.set($('pw').value);
    load();
  });
  $('refresh').addEventListener('click', load);
  $('logout').addEventListener('click', function () { store.clear(); showGate(''); });
  load();
})();
</script>
<script>
// ---------------------------------------------------------------- Plan tab
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pm = window.__pm;
  var state = { items: [], stages: [], weekStart: mondayOf(todaySAST()), open: {}, editing: null, loaded: false };
  var TAB_KEY = 'playmaker-tab';

  function todaySAST() { return new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function mondayOf(iso) { var d = new Date(iso + 'T00:00:00Z'); var wd = (d.getUTCDay() + 6) % 7; return addDays(iso, -wd); }
  function dayName(iso, opts) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-ZA', Object.assign({ timeZone: 'UTC' }, opts)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function fmt(n) { return n == null ? '—' : Number(n).toLocaleString('en-ZA'); }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }

  // Tiny, safe markdown: headings, bold, lists, checkboxes, paragraphs. Escapes everything first.
  function md(src) {
    if (!src) return '';
    var lines = esc(src).split('\n'), out = [], list = null;
    function close() { if (list) { out.push('</' + list + '>'); list = null; } }
    lines.forEach(function (l) {
      var t = l.trim();
      var inline = function (s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/- \[ \] /, '☐ ').replace(/- \[x\] /i, '☑ '); };
      if (!t) { close(); return; }
      var h = t.match(/^#{1,4}\s+(.*)$/);
      if (h) { close(); out.push('<h5>' + inline(h[1]) + '</h5>'); return; }
      var ul = t.match(/^[-•]\s+(.*)$/), ol = t.match(/^\d+\.\s+(.*)$/);
      if (ul || ol) {
        var kind = ul ? 'ul' : 'ol';
        if (list !== kind) { close(); out.push('<' + kind + '>'); list = kind; }
        out.push('<li>' + inline((ul || ol)[1].replace(/^\[ \] /, '☐ ').replace(/^\[x\] /i, '☑ ')) + '</li>');
        return;
      }
      close(); out.push('<p>' + inline(t) + '</p>');
    });
    close();
    return out.join('');
  }

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: { 'x-dashboard-key': pm.getKey(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.status === 401) { pm.onLocked(); throw new Error('Locked'); }
        if (!r.ok) throw new Error(b.error || ('Error ' + r.status));
        return b;
      });
    });
  }

  // Match a planned item to a live Instagram post: same SAST date, then the
  // best overlap between the opening line and the caption's first line.
  function words(s) { return (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(function (w) { return w.length > 3; }); }
  function liveFor(item) {
    var d = pm.dashboard; if (!d || !d.posts || !item.post_date) return null;
    if (item.media_id) { var exact = d.posts.filter(function (p) { return p.id === item.media_id; })[0]; if (exact) return exact; }
    if (item.format === 'Story') return null;
    var same = d.posts.filter(function (p) { return new Date(new Date(p.timestamp).getTime() + 2 * 3600e3).toISOString().slice(0, 10) === item.post_date; });
    if (!same.length) return null;
    var want = words(item.hook || item.title);
    var scored = same.map(function (p) { var w = words(p.firstLine); return { p: p, s: want.filter(function (x) { return w.indexOf(x) >= 0; }).length }; })
      .sort(function (a, b) { return b.s - a.s; });
    if (scored[0].s > 0) return scored[0].p;
    var sameDayPlanned = state.items.filter(function (i) { return i.post_date === item.post_date && i.format !== 'Story'; }).length;
    return same.length === 1 && sameDayPlanned === 1 ? same[0] : null;
  }

  function stageSelect(item) {
    return '<select class="stage stage-' + esc(item.stage) + '" data-id="' + item.id + '" aria-label="Stage">' +
      state.stages.map(function (s) { return '<option' + (s === item.stage ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>';
  }

  function itemHTML(item) {
    var live = liveFor(item), open = !!state.open[item.id], editing = state.editing === item.id;
    var h = '<div class="item' + (item.stage === 'Posted' || live ? ' posted' : '') + '" data-id="' + item.id + '">' +
      '<div class="head"><div>' +
      '<div class="meta">' + (item.slot ? '<span>' + esc(item.slot) + '</span>' : '') +
      (item.series ? '<span class="chip">' + esc(item.series) + '</span>' : '') +
      (item.format ? '<span>' + esc(item.format) + '</span>' : '') + '</div>' +
      '<div class="title">' + esc(item.title) + '</div>' +
      (item.hook ? '<div class="hook">“' + esc(item.hook) + '”</div>' : '') +
      '</div>' + stageSelect(item) + '</div>';
    if (live) {
      h += '<div class="live"><a href="' + esc(live.permalink) + '" target="_blank" rel="noopener">Live ↗</a>' +
        '<span>Reach <b>' + fmt(live.reach) + '</b></span><span>Views <b>' + fmt(live.views) + '</b></span>' +
        '<span>Shares <b>' + fmt(live.shares) + '</b></span><span>Saves <b>' + fmt(live.saved) + '</b></span>' +
        '<span>Follows <b>' + fmt(live.follows) + '</b></span></div>';
    }
    var has = item.script || item.caption || item.notes;
    if (!editing) h += '<button type="button" class="toggle" data-act="toggle">' + (open ? 'Hide' : (has ? 'Open script & caption' : 'Add script & caption')) + '</button>';
    if (editing) {
      h += '<div class="body">' +
        '<label>Title</label><input data-f="title" value="' + esc(item.title) + '" maxlength="200">' +
        '<label>Date</label><input data-f="post_date" type="date" value="' + esc(item.post_date || '') + '">' +
        '<label>Opening line</label><input data-f="hook" value="' + esc(item.hook || '') + '" maxlength="500">' +
        '<label>Script</label><textarea data-f="script">' + esc(item.script || '') + '</textarea>' +
        '<label>Caption</label><textarea data-f="caption">' + esc(item.caption || '') + '</textarea>' +
        '<label>Notes</label><textarea data-f="notes" style="min-height:60px">' + esc(item.notes || '') + '</textarea>' +
        '<div class="btnrow"><button type="button" class="ghost sm" data-act="cancel">Cancel</button><button type="button" class="sm" data-act="save">Save</button></div></div>';
    } else if (open) {
      h += '<div class="body">' +
        (item.script ? '<h4>Script</h4><div class="md">' + md(item.script) + '</div>' : '') +
        (item.caption ? '<h4>Caption</h4><div class="caption">' + esc(item.caption) + '</div>' : '') +
        (item.notes ? '<h4>Notes</h4><div class="md">' + md(item.notes) + '</div>' : '') +
        '<div class="btnrow">' + (item.caption ? '<button type="button" class="sm" data-act="copy">Copy caption</button>' : '') +
        '<button type="button" class="ghost sm" data-act="edit">Edit</button></div></div>';
    }
    return h + '</div>';
  }

  function render() {
    var ws = state.weekStart, we = addDays(ws, 6), today = todaySAST();
    var isThis = ws === mondayOf(today);
    $('weekLabel').textContent = isThis ? 'This week' : (ws === addDays(mondayOf(today), 7) ? 'Next week' : (ws === addDays(mondayOf(today), -7) ? 'Last week' : 'Week of ' + dayName(ws, { day: 'numeric', month: 'short' })));
    $('weekSub').textContent = dayName(ws, { day: 'numeric', month: 'short' }) + ' – ' + dayName(we, { day: 'numeric', month: 'short' });
    var html = '';
    for (var i = 0; i < 7; i++) {
      var day = addDays(ws, i);
      var items = state.items.filter(function (it) { return it.post_date === day && it.stage !== 'Parked'; });
      html += '<div class="day' + (day === today ? ' today' : '') + '"><h3>' + dayName(day, { weekday: 'long', day: 'numeric', month: 'short' }) + (day === today ? ' · today' : '') + '</h3>' +
        (items.length ? items.map(itemHTML).join('') : '<div class="empty">Nothing planned.</div>') + '</div>';
    }
    $('planDays').innerHTML = html;
    var parked = state.items.filter(function (it) { return it.stage === 'Parked' || !it.post_date; });
    $('parkedCount').textContent = '(' + parked.length + ')';
    $('parkedList').innerHTML = parked.map(itemHTML).join('') || '<div class="empty">Nothing parked.</div>';
  }

  function load() {
    $('planMsg').innerHTML = state.loaded ? '' : '<div class="banner info">Loading your plan…</div>';
    return api('GET', '/api/content').then(function (b) {
      state.items = b.items || []; state.stages = b.stages || []; state.loaded = true;
      $('planMsg').innerHTML = ''; render();
    }).catch(function (e) {
      if (e.message !== 'Locked') $('planMsg').innerHTML = '<div class="banner warn"><b>Couldn\'t load the plan.</b> ' + esc(e.message) + '</div>';
    });
  }

  function find(id) { return state.items.filter(function (i) { return i.id === id; })[0]; }
  function replace(item) { state.items = state.items.map(function (i) { return i.id === item.id ? item : i; }); }

  function patch(id, fields, msg) {
    return api('PATCH', '/api/content?id=' + encodeURIComponent(id), fields).then(function (b) {
      replace(b.item); render(); if (msg) toast(msg);
    }).catch(function (e) { if (e.message !== 'Locked') { toast('Not saved: ' + e.message); render(); } });
  }

  document.addEventListener('change', function (e) {
    var sel = e.target.closest('select.stage'); if (!sel) return;
    patch(sel.getAttribute('data-id'), { stage: sel.value }, 'Stage: ' + sel.value);
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var card = btn.closest('.item'); if (!card) return;
    var id = card.getAttribute('data-id'), item = find(id), act = btn.getAttribute('data-act');
    if (act === 'toggle') { state.open[id] = !state.open[id]; if (!item.script && !item.caption && !item.notes) state.editing = id; render(); }
    if (act === 'edit') { state.editing = id; render(); }
    if (act === 'cancel') { state.editing = null; render(); }
    if (act === 'copy') {
      var done = function () { toast('Caption copied'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(item.caption).then(done, function () { toast('Copy failed'); });
    }
    if (act === 'save') {
      var fields = {};
      card.querySelectorAll('[data-f]').forEach(function (el) { fields[el.getAttribute('data-f')] = el.value; });
      if (!fields.title.trim()) { toast('Title can\'t be empty'); return; }
      state.editing = null; state.open[id] = true;
      patch(id, fields, 'Saved');
    }
  });

  $('prevWeek').addEventListener('click', function () { state.weekStart = addDays(state.weekStart, -7); render(); });
  $('nextWeek').addEventListener('click', function () { state.weekStart = addDays(state.weekStart, 7); render(); });
  $('thisWeek').addEventListener('click', function () { state.weekStart = mondayOf(todaySAST()); render(); });
  $('addIdea').addEventListener('click', function () { $('ideaForm').classList.toggle('hidden'); $('ideaTitle').focus(); });
  $('ideaCancel').addEventListener('click', function () { $('ideaForm').classList.add('hidden'); });
  $('ideaForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var body = { title: $('ideaTitle').value.trim(), post_date: $('ideaDate').value || null, hook: $('ideaHook').value.trim() || null, stage: 'Idea' };
    api('POST', '/api/content', body).then(function (b) {
      state.items.push(b.item);
      state.items.sort(function (a, c) { return (a.post_date || '9999') < (c.post_date || '9999') ? -1 : 1; });
      $('ideaForm').reset(); $('ideaForm').classList.add('hidden');
      if (b.item.post_date) state.weekStart = mondayOf(b.item.post_date); else $('parkedWrap').open = true;
      render(); toast('Idea added');
    }).catch(function (err) { if (err.message !== 'Locked') toast('Not added: ' + err.message); });
  });

  function show(tab) {
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-tab') === tab); });
    $('viewPlan').classList.toggle('hidden', tab !== 'plan');
    $('viewScore').classList.toggle('hidden', tab !== 'score');
    try { localStorage.setItem(TAB_KEY, tab); } catch (e) {}
    if (tab === 'plan' && !state.loaded) load();
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { show(t.getAttribute('data-tab')); }); });
  pm.onDashboard = function () {
    if (state.loaded) render();
    else { var saved = 'score'; try { saved = localStorage.getItem(TAB_KEY) || 'score'; } catch (e) {} if (saved === 'plan') show('plan'); }
  };
  $('refresh').addEventListener('click', function () { if (state.loaded) load(); });
})();
</script>
